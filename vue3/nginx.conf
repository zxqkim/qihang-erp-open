user  nginx;
worker_processes  auto;

# 容器场景下让 nginx 前台运行，日志输出到 stdout/stderr 以便 docker logs 收集
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 前端构建已生成 .gz，直接复用
    gzip              on;
    gzip_static       on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # 设置 Vue 应用的静态文件路径
        root /usr/share/nginx/html;
        index index.html;

        # 默认 location 配置（SPA history 路由回退）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 处理 /prod-api/ 的代理请求
        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # --- 新增 SSE 关键配置 ---
            proxy_http_version 1.1;       # 必须使用 HTTP/1.1
            proxy_buffering off;          # 关闭缓冲，确保数据实时发送
            proxy_read_timeout 1800s;     # 增加读取超时时间 (例如 30 分钟)
            proxy_send_timeout 1800s;     # 增加发送超时时间 (例如 30 分钟)
            proxy_connect_timeout 60s;    # 连接超时时间
            # --- 结束新增 ---
            proxy_pass http://erp-api:6149/;
        }

    }

}
